---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/aqua-yaml.json
# aqua - Declarative CLI Version Manager
# https://aquaproj.github.io/
# checksum:
#   enabled: true
#   require_checksum: true
#   supported_envs:
#   - all
registries:
- type: standard
  ref: v4.526.0 # renovate: depName=aquaproj/aqua-registry
packages:
- name: hashicorp/terraform@v1.15.6 # generate plan.json fixtures (go test -update)
- name: golangci/golangci-lint@v2.12.2 # linter (matches the version pinned in CI)
- name: suzuki-shunsuke/pinact@v4.1.0 # pin GitHub Actions to commit SHAs
- name: goreleaser/goreleaser@v2.16.0 # release binaries (matches the version pinned in CI)
