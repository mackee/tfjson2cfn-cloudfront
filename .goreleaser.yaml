# GoReleaser config — https://goreleaser.com
# Local check:    goreleaser check
# Local dry run:  goreleaser release --snapshot --clean
version: 2

project_name: tfjson2cfn-cloudfront

before:
  hooks:
    - go mod tidy

builds:
  - id: tfjson2cfn-cloudfront
    main: ./cmd/tfjson2cfn-cloudfront
    binary: tfjson2cfn-cloudfront
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: tfjson2cfn-cloudfront
    formats: [tar.gz]
    # Windows users expect a .zip.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: mackee
    name: tfjson2cfn-cloudfront
  prerelease: auto
